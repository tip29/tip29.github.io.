
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои игры</title>
  <style>
    body { font-family: sans-serif; background: #1e1e2e; color: #fff;
           text-align: center; padding: 40px 16px; }
    input, button { font-size: 18px; padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>Угадай число от 1 до 100</h1>
  <input id="guess" type="number">
  <button onclick="check()">Проверить</button>
  <p id="result"></p>

  <script>
    const secret = Math.floor(Math.random() * 100) + 1;
    function check() {
      const n = Number(document.getElementById("guess").value);
      const r = document.getElementById("result");
      if (n === secret) r.textContent = "Верно! 🎉";
      else r.textContent = n < secret ? "Больше" : "Меньше";
    }
  </script>
</body>
</html>
